<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:p="primefaces">

<h:head>
</h:head>

<h:body>
    <h:form>
        <div class="card">
            <p:dataTable var="color" value="#{colorController.colors}">
                <p:column headerText="ID">
                    <h:outputText value="#{color.id}" />
                </p:column>

                <p:column headerText="Name">
                    <h:outputText value="#{color.name}" />
                </p:column>

            </p:dataTable>
        </div>
    </h:form>
</h:body>

</html>
